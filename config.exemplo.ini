; Configuração do Busca Carro
; O e-mail se configura pelo painel ("E-mail do resultado"); o resto pode ser ajustado aqui.
; Linhas que começam com ponto e vírgula são comentários.

[email]
ativo = sim
remetente =
senha_app =
destinatarios =

[execucao]
; De quantos em quantos dias a busca roda
intervalo_dias = 2
; sim = mostra a janela do navegador durante a coleta (útil se algum site começar a bloquear)
mostrar_navegador = nao
; Repetir a mesma busca dentro deste prazo (em minutos) reaproveita o que cada site já respondeu, em vez de
; consultá-lo de novo (consultas seguidas fazem os sites bloquearem). Só os sites que falharam são lidos de novo.
; 0 = sempre consultar tudo de novo.
reaproveitar_leitura_minutos = 120

[limites]
; Teto por site e por busca, para a rodada não demorar demais em buscas muito amplas
max_paginas_por_site = 15
max_anuncios_por_site = 300

[sites]
webmotors = sim
olx = sim
mercadolivre = sim
; Em out/2026 o iCarros está com a busca de anúncios desativada; o programa só confere se voltou.
icarros = sim

[alertas]
; Marca com alerta anúncios com preço muito abaixo da FIPE (possível golpe ou problema). Em %.
alertar_abaixo_da_fipe_pct = 25

[fipe]
; Opcional. A API gratuita da FIPE aceita 500 consultas/dia sem token, suficiente para várias buscas
; (os preços ficam guardados no mês). Se aparecer "limite diário de consultas" no log, crie um token
; grátis em https://fipe.api.br/register (sobe para 1.000/dia) e cole aqui.
token =
