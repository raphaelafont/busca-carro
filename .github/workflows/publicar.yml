# Publica uma versão do Busca Carro quando a versão em buscacarros/__init__.py muda no main.
# Gera o pacote do programa, o atualizacao.json e o instalador, e cria a release v<versão> (com a tag).
# Os PCs instalados leem releases/latest/download/atualizacao.json e se atualizam sozinhos.
name: Publicar versão

on:
  push:
    branches: [main]
    paths: ['buscacarros/__init__.py']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Versão a publicar
        id: versao
        run: |
          V=$(python3 -c "import re; print(re.search(r\"__version__\\s*=\\s*'([^']+)'\", open('buscacarros/__init__.py', encoding='utf-8').read()).group(1))")
          echo "Versão do programa: $V"
          echo "V=$V" >> "$GITHUB_ENV"
          if git ls-remote --exit-code --tags origin "refs/tags/v$V" > /dev/null; then
            echo "A versão $V já está publicada; nada a fazer."
            echo "publicar=nao" >> "$GITHUB_OUTPUT"
          else
            test -s "notas/$V.txt" || { echo "Faltam as notas em notas/$V.txt"; exit 1; }
            echo "publicar=sim" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.versao.outputs.publicar == 'sim'
        with:
          python-version: '3.13'

      - name: Ferramentas (requests)
        if: steps.versao.outputs.publicar == 'sim'
        run: |
          python -m pip install -q requests

      - name: Testes
        if: steps.versao.outputs.publicar == 'sim'
        run: |
          python testes/teste_memoria.py
          python testes/teste_atualizacao.py

      - name: Pacote, atualizacao.json e instalador
        if: steps.versao.outputs.publicar == 'sim'
        run: python publicar.py --so-gerar

      - name: Release (rascunho, arquivos, e só então pública)
        if: steps.versao.outputs.publicar == 'sim'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$V" \
            "dist/$V/atualizacao.json" "dist/$V/buscacarros-$V.zip" "dist/$V/BuscaCarro-Instalador.zip" \
            --target "$GITHUB_SHA" --title "Busca Carro $V" --notes-file "notas/$V.txt" --draft
          gh release edit "v$V" --draft=false --latest
